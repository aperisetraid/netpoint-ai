# Weekly checks for outdated or vulnerable dependencies in each service.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/vision-ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
