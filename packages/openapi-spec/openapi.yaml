openapi: 3.0.3
info:
  title: NetPoint AI API
  description: API REST para el procesado de partidos de tenis, extracción de telemetría y coach táctico conversacional.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desarrollo

paths:
  /matches:
    get:
      summary: Listar los partidos ya analizados (biblioteca)
      description: Recorre los resultados guardados por el servicio de visión y devuelve sus metadatos, del más reciente al más antiguo. No reprocesa ningún vídeo.
      operationId: listMatches
      responses:
        '200':
          description: Listado de partidos analizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryMatchSummary'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}:
    get:
      summary: Abrir un partido analizado de la biblioteca
      description: Devuelve la telemetría guardada de un partido y deja su vídeo disponible para la reproducción, sin volver a procesarlo.
      operationId: getLibraryMatch
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Partido cargado desde la biblioteca.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MatchTelemetryResponse'
                  - type: object
                    required: [title]
                    properties:
                      title:
                        type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/process:
    post:
      summary: Procesar un partido y devolver telemetría
      description: Envía la URL del vídeo al servicio de visión y devuelve la telemetría detectada por fotograma.
      operationId: processMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessMatchRequest'
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ProcessingDisabled'

  /matches/upload:
    post:
      summary: Subir y procesar un archivo de video
      description: Acepta videos MP4, M4V, MOV, AVI, MKV o WebM de hasta 1 GB y retransmite el archivo en streaming al servicio de visión.
      operationId: uploadMatchVideo
      parameters:
        - name: X-Video-Filename
          in: header
          required: true
          schema:
            type: string
          description: Nombre de archivo codificado con URL encoding.
        - name: X-Title
          in: header
          required: false
          schema:
            type: string
          description: Título del partido codificado con URL encoding.
        - name: X-Match-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Identificador de partido usado para consultar progreso.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ProcessingDisabled'

  /matches/{matchId}/status:
    get:
      summary: Consultar estado del procesamiento
      description: Endpoint planificado, aún no implementado en el backend.
      operationId: getMatchStatus
      x-implementation-status: planned
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual de la tarea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/progress:
    get:
      summary: Consultar fotogramas procesados
      description: Devuelve el avance actual del procesamiento del video.
      operationId: getMatchProgress
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progreso actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProgressResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/telemetry:
    get:
      summary: Obtener telemetría táctica y coordenadas para el Overlay
      description: Devuelve las detecciones por fotograma (jugadores y bola) con bbox y coordenadas métricas de la pista.
      operationId: getMatchTelemetry
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de telemetría devueltos correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTelemetryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/coach:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      summary: Estado del coach táctico de un partido
      description: Devuelve la conversación guardada junto al análisis, si hay credenciales de Claude configuradas, y datos deterministas para iniciar la charla (récords y preguntas sugeridas).
      operationId: getCoachSession
      responses:
        '200':
          description: Sesión del coach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoachSession'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422Unprocessable'
        '502':
          $ref: '#/components/responses/502BadGateway'
    delete:
      summary: Reiniciar la conversación con el coach
      operationId: resetCoachSession
      responses:
        '204':
          description: Conversación eliminada.
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/coach/messages:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    post:
      summary: Preguntar al coach táctico (respuesta en streaming)
      description: |
        Envía una pregunta en lenguaje natural sobre el partido. La respuesta llega como Server-Sent Events;
        cada evento `data:` es un JSON con `type`:
        - `text` (`delta`): fragmento de la respuesta.
        - `replace` (`text`): sustituye el borrador visible (una ronda se repitió).
        - `status` (`label`): progreso (consultas a la telemetría y notas del coach).
        - `done` (`question`, `message`): turno guardado en la conversación.
        - `error` (`message`): el turno falló y no se guardó nada.
        Los instantes del vídeo se citan en Markdown como `[m:ss](#t=SEGUNDOS)`.
      operationId: postCoachMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachMessageRequest'
      responses:
        '200':
          description: Flujo de eventos de la respuesta.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422Unprocessable'
        '502':
          $ref: '#/components/responses/502BadGateway'

components:
  schemas:
    ProcessMatchRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          minLength: 1
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        title:
          type: string
          example: "Final Alcaraz vs Sinner - Set 1"
        matchId:
          type: string
          format: uuid

    ProcessMatchResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [completed]
          example: "completed"
        telemetry:
          $ref: '#/components/schemas/MatchTelemetry'

    MatchStatusResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
      properties:
        matchId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
          example: "completed"
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 100

    LibraryMatchSummary:
      type: object
      required: [id, title, createdAt, source, videoFilename, hasVideo, fps, width, height, frameCount, durationSeconds, calibrated, hitCount, bounceCount, maxSpeedKmh]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          nullable: true
          enum: [url, upload]
        videoFilename:
          type: string
          nullable: true
        hasVideo:
          type: boolean
        fps:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        frameCount:
          type: integer
        durationSeconds:
          type: number
          nullable: true
        calibrated:
          type: boolean
        hitCount:
          type: integer
        bounceCount:
          type: integer
        maxSpeedKmh:
          type: number
          nullable: true

    MatchProgressResponse:
      type: object
      additionalProperties: false
      required:
        - processedFrames
        - totalFrames
      properties:
        processedFrames:
          type: integer
          minimum: 0
        totalFrames:
          type: integer
          minimum: 0
          nullable: true

    MatchTelemetryResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
        telemetry:
          $ref: '#/components/schemas/MatchTelemetry'

    MatchTelemetry:
      type: object
      additionalProperties: false
      description: Telemetría consolidada del partido (contrato v2).
      required: [version, video, court, frames, events]
      properties:
        version:
          type: integer
          example: 2
        video:
          type: object
          additionalProperties: false
          required: [fps, width, height, frame_count]
          properties:
            fps:
              type: number
              nullable: true
            width:
              type: integer
              minimum: 0
            height:
              type: integer
              minimum: 0
            frame_count:
              type: integer
              minimum: 0
        court:
          type: object
          additionalProperties: false
          required: [length_meters, width_meters, calibrated]
          properties:
            length_meters:
              type: number
              example: 23.77
            width_meters:
              type: number
              example: 10.97
            calibrated:
              type: boolean
            colors:
              type: object
              additionalProperties: false
              required: [surface]
              description: Colores medidos en el vídeo (superficie dentro de las líneas y entorno fuera de ellas). Ausente si el vídeo no permite medirlos.
              properties:
                surface:
                  type: string
                  pattern: "^#[0-9A-Fa-f]{6}$"
                  example: "#5574AF"
                surround:
                  type: string
                  pattern: "^#[0-9A-Fa-f]{6}$"
                  example: "#769B77"
        frames:
          type: array
          items:
            $ref: '#/components/schemas/FrameTelemetry'
        events:
          type: object
          additionalProperties: false
          required: [bounces, hits]
          properties:
            bounces:
              type: array
              items:
                $ref: '#/components/schemas/BounceEvent'
            hits:
              type: array
              items:
                $ref: '#/components/schemas/HitEvent'

    BounceEvent:
      type: object
      additionalProperties: false
      required: [timestamp_seconds, frame_index, x_meters, y_meters, side, confidence, method]
      properties:
        timestamp_seconds:
          type: number
          description: Instante del bote, con resolución inferior a un fotograma.
        frame_index:
          type: integer
        x_meters:
          type: number
        y_meters:
          type: number
        side:
          type: string
          enum: [far, near]
        confidence:
          type: number
        method:
          type: string
          enum: [fit3d, image2d]
          description: fit3d si la posición procede del ajuste balístico 3D; image2d si solo de la trayectoria en imagen.

    HitEvent:
      type: object
      additionalProperties: false
      required: [timestamp_seconds, frame_index, player, type, speed_kmh, point_index, ball, player_position, confidence]
      properties:
        timestamp_seconds:
          type: number
        frame_index:
          type: integer
        player:
          type: string
          enum: [far, near]
        type:
          type: string
          enum: [serve, volley, forehand, backhand]
        speed_kmh:
          type: number
          nullable: true
          description: Velocidad estimada de salida de la pelota; null si no se pudo medir.
        point_index:
          type: integer
        ball:
          type: object
          additionalProperties: false
          required: [x, y, z]
          properties:
            x:
              type: number
              nullable: true
            y:
              type: number
              nullable: true
            z:
              type: number
              nullable: true
        player_position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        confidence:
          type: number

    FrameTelemetry:
      type: object
      additionalProperties: false
      required:
        - frame_index
        - timestamp_seconds
        - detections
      properties:
        frame_index:
          type: integer
          example: 0
        timestamp_seconds:
          type: number
          example: 0.04
        court_corners:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          description: Vértices en píxeles usados para la calibración, en orden alrededor de la pista; null si no se ha calibrado.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        detections:
          type: array
          items:
            $ref: '#/components/schemas/DetectionTelemetry'

    DetectionTelemetry:
      type: object
      additionalProperties: false
      required:
        - class
        - confidence
        - bbox
        - x_meters
        - y_meters
      properties:
        class:
          type: string
          enum: [player, ball]
        confidence:
          type: number
          example: 0.97
        carried_forward:
          type: boolean
          description: Indica una posición de jugador reutilizada de un fotograma anterior, no una detección nueva.
        interpolated:
          type: boolean
          description: Indica una posición de pelota estimada a partir de su trayectoria en un fotograma donde no se detectó; no es una medición.
        source:
          type: string
          enum: [yolo, yolo_court, color, motion, interpolated, flight3d]
          description: >-
            Origen de la posición de la pelota: un detector (yolo, yolo_court, color, motion) validado por su trayectoria,
            la interpolación en imagen entre mediciones (interpolated) o el vuelo balístico 3D ajustado (flight3d).
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        x_meters:
          type: number
          nullable: true
          description: Posición en metros a lo largo de la pista; null si la pista no está calibrada.
          example: 1.2
        y_meters:
          type: number
          nullable: true
          description: Posición en metros a lo ancho de la pista; null si la pista no está calibrada.
          example: 4.5
        z_meters:
          type: number
          nullable: true
          description: Altura estimada de la pelota por ajuste balístico; null si no se pudo reconstruir.

    CoachMessageRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          example: "¿Qué patrón se repite cuando me atacan el revés?"
        players:
          type: object
          additionalProperties: false
          description: Nombres de los jugadores de cada lado.
          properties:
            far:
              type: string
              maxLength: 80
            near:
              type: string
              maxLength: 80
        perspective:
          type: string
          nullable: true
          enum: [far, near, coach]
          description: Quién pregunta. "yo" se refiere a este jugador; coach = entrenador o analista.
        currentTime:
          type: number
          nullable: true
          minimum: 0
          description: Posición del reproductor en segundos; da sentido a "este punto".

    CoachTranscriptEntry:
      type: object
      required: [id, role, text, createdAt, tools]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
          description: Markdown; los instantes del vídeo se enlazan como [m:ss](#t=SEGUNDOS).
        createdAt:
          type: string
          format: date-time
        tools:
          type: array
          items:
            type: string
          description: Consultas a la telemetría que respaldan la respuesta.

    CoachHighlight:
      type: object
      required: [label, value, detail, time]
      properties:
        label:
          type: string
          example: "Punto más largo"
        value:
          type: string
          example: "17 golpes"
        detail:
          type: string
          example: "P2 · 23 s"
        time:
          type: number
          description: Segundo del vídeo al que salta.

    CoachSession:
      type: object
      required: [available, model, messages, highlights, suggestions, reportPrompt]
      properties:
        available:
          type: boolean
          description: Hay credenciales de Anthropic configuradas en el servicio de visión.
        model:
          type: string
          example: "claude-opus-5-5"
        messages:
          type: array
          items:
            $ref: '#/components/schemas/CoachTranscriptEntry'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/CoachHighlight'
        suggestions:
          type: array
          items:
            type: string
        reportPrompt:
          type: string
          description: Pregunta que genera el informe táctico completo.

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  parameters:
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    400BadRequest:
      description: Solicitud incorrecta o parámetros faltantes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: El coach todavía está respondiendo a otra pregunta de este partido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    422Unprocessable:
      description: La telemetría guardada no es compatible con el coach.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    502BadGateway:
      description: El servicio de visión no pudo procesar el vídeo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    503ProcessingDisabled:
      description: Despliegue de solo lectura (demo pública); el análisis de vídeos nuevos está desactivado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
