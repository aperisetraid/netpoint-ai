openapi: 3.0.3
info:
  title: NetPoint AI API
  description: API REST para el procesado de partidos de tenis, extracción de telemetría y consulta táctica multi-agente.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desarrollo

paths:
  /matches/process:
    post:
      summary: Procesar un partido y devolver telemetría
      description: Envía la URL del vídeo al servicio de visión y devuelve la telemetría detectada por fotograma.
      operationId: processMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessMatchRequest'
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          description: El servicio de visión no pudo procesar el vídeo.

  /matches/{matchId}/status:
    get:
      summary: Consultar estado del procesamiento
      operationId: getMatchStatus
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual de la tarea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/telemetry:
    get:
      summary: Obtener telemetría táctica y coordenadas para el Overlay
      description: Devuelve las coordenadas 2D de la pista, trayectorias de la bola, botes (In/Out), velocidad y mapas de calor.
      operationId: getMatchTelemetry
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de telemetría devueltos correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTelemetryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/chat:
    post:
      summary: Consulta conversacional al sistema Multi-Agente
      description: Envía preguntas en lenguaje natural sobre el partido al pool de agentes (Táctico, Biomecánico, Estratégico).
      operationId: queryAgentChat
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: Respuesta generada por los agentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueryResponse'

components:
  schemas:
    ProcessMatchRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          minLength: 1
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        title:
          type: string
          example: "Final Alcaraz vs Sinner - Set 1"

    ProcessMatchResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [completed]
          example: "completed"
        telemetry:
          type: array
          items:
            $ref: '#/components/schemas/FrameTelemetry'

    MatchStatusResponse:
      type: object
      properties:
        matchId:
          MatchStatusResponse:
            type: object
            properties:
              matchId:
                type: string
                format: uuid
              status:
                type: string
                enum: [queued, processing, completed, failed]
                example: "completed"
              progressPercentage:
                type: integer
                example: 100

          MatchTelemetryResponse:
            type: object
            additionalProperties: false
            required:
              - matchId
              - telemetry
            properties:
              matchId:
                type: string
                format: uuid
              telemetry:
                type: array
                items:
                  $ref: '#/components/schemas/FrameTelemetry'

          FrameTelemetry:
            type: object
            additionalProperties: false
            required:
              - frame_index
              - timestamp_seconds
              - detections
            properties:
              frame_index:
                type: integer
                example: 0
              timestamp_seconds:
                type: number
                example: 0.04
              detections:
                type: array
                items:
                  $ref: '#/components/schemas/DetectionTelemetry'

          DetectionTelemetry:
            type: object
            additionalProperties: false
            required:
              - class
              - confidence
              - bbox
              - x_meters
              - y_meters
            properties:
              class:
                type: string
                enum: [player, ball]
              confidence:
                type: number
                example: 0.97
              bbox:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: number
              x_meters:
                type: number
                nullable: true
                example: 1.2
              y_meters:
                type: number
                nullable: true
                example: 4.5

          ChatQueryRequest:
            type: object
            required:
              - prompt
            properties:
              prompt:
                type: string
                example: "¿Por qué estoy perdiendo puntos cuando juego cruzado desde el fondo?"
        answer:
          type: string
          example: "Has realizado 14 tiros cruzados. En un 65% de los casos la bola cayó corta..."
        agentRole:
          type: string
          example: "Agente Táctico"
        recommendations:
          type: array
          items:
            type: string

  responses:
    400BadRequest:
      description: Solicitud incorrecta o parámetros faltantes.
    404NotFound:
      description: El recurso solicitado no existe.