openapi: 3.0.3
info:
  title: NetPoint AI API
  description: API REST para el procesado de partidos de tenis, extracción de telemetría y consulta táctica multi-agente.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desarrollo

paths:
  /matches/process:
    post:
      summary: Procesar un partido y devolver telemetría
      description: Envía la URL del vídeo al servicio de visión y devuelve la telemetría detectada por fotograma.
      operationId: processMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessMatchRequest'
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/upload:
    post:
      summary: Subir y procesar un archivo de video
      description: Acepta videos MP4, M4V, MOV, AVI, MKV o WebM de hasta 1 GB y retransmite el archivo en streaming al servicio de visión.
      operationId: uploadMatchVideo
      parameters:
        - name: X-Video-Filename
          in: header
          required: true
          schema:
            type: string
          description: Nombre de archivo codificado con URL encoding.
        - name: X-Title
          in: header
          required: false
          schema:
            type: string
          description: Título del partido codificado con URL encoding.
        - name: X-Match-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Identificador de partido usado para consultar progreso.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/status:
    get:
      summary: Consultar estado del procesamiento
      description: Endpoint planificado, aún no implementado en el backend.
      operationId: getMatchStatus
      x-implementation-status: planned
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual de la tarea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/progress:
    get:
      summary: Consultar fotogramas procesados
      description: Devuelve el avance actual del procesamiento del video.
      operationId: getMatchProgress
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progreso actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProgressResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/telemetry:
    get:
      summary: Obtener telemetría táctica y coordenadas para el Overlay
      description: Devuelve las detecciones por fotograma (jugadores y bola) con bbox y coordenadas métricas de la pista.
      operationId: getMatchTelemetry
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de telemetría devueltos correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTelemetryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/chat:
    post:
      summary: Consulta conversacional al sistema Multi-Agente
      description: Endpoint planificado, aún no implementado. Envía preguntas en lenguaje natural sobre el partido al pool de agentes (Táctico, Biomecánico, Estratégico).
      operationId: queryAgentChat
      x-implementation-status: planned
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: Respuesta generada por los agentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  schemas:
    ProcessMatchRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          minLength: 1
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        title:
          type: string
          example: "Final Alcaraz vs Sinner - Set 1"
        matchId:
          type: string
          format: uuid

    ProcessMatchResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [completed]
          example: "completed"
        telemetry:
          type: array
          items:
            $ref: '#/components/schemas/FrameTelemetry'

    MatchStatusResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
      properties:
        matchId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
          example: "completed"
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 100

    MatchProgressResponse:
      type: object
      additionalProperties: false
      required:
        - processedFrames
        - totalFrames
      properties:
        processedFrames:
          type: integer
          minimum: 0
        totalFrames:
          type: integer
          minimum: 0
          nullable: true

    MatchTelemetryResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
        telemetry:
          type: array
          items:
            $ref: '#/components/schemas/FrameTelemetry'

    FrameTelemetry:
      type: object
      additionalProperties: false
      required:
        - frame_index
        - timestamp_seconds
        - detections
      properties:
        frame_index:
          type: integer
          example: 0
        timestamp_seconds:
          type: number
          example: 0.04
        image_width:
          type: integer
          minimum: 1
        image_height:
          type: integer
          minimum: 1
        court_corners:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          description: Vértices en píxeles usados para la calibración, en orden alrededor de la pista; null si no se ha calibrado.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        detections:
          type: array
          items:
            $ref: '#/components/schemas/DetectionTelemetry'

    DetectionTelemetry:
      type: object
      additionalProperties: false
      required:
        - class
        - confidence
        - bbox
        - x_meters
        - y_meters
      properties:
        class:
          type: string
          enum: [player, ball]
        confidence:
          type: number
          example: 0.97
        carried_forward:
          type: boolean
          description: Indica una posición de jugador reutilizada de un fotograma anterior, no una detección nueva.
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        x_meters:
          type: number
          nullable: true
          description: Posición en metros a lo largo de la pista; null si la pista no está calibrada.
          example: 1.2
        y_meters:
          type: number
          nullable: true
          description: Posición en metros a lo ancho de la pista; null si la pista no está calibrada.
          example: 4.5

    ChatQueryRequest:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          example: "¿Por qué estoy perdiendo puntos cuando juego cruzado desde el fondo?"

    ChatQueryResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - agentRole
      properties:
        answer:
          type: string
          example: "Has realizado 14 tiros cruzados. En un 65% de los casos la bola cayó corta..."
        agentRole:
          type: string
          example: "Agente Táctico"
        recommendations:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    400BadRequest:
      description: Solicitud incorrecta o parámetros faltantes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    502BadGateway:
      description: El servicio de visión no pudo procesar el vídeo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'