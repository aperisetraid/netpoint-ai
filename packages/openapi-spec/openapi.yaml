openapi: 3.0.3
info:
  title: NetPoint AI API
  description: API REST para el procesado de partidos de tenis, extracción de telemetría y consulta táctica multi-agente.
  version: 1.0.0
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Servidor Local de Desarrollo

paths:
  /matches/process:
    post:
      summary: Procesar un partido y devolver telemetría
      description: Envía la URL del vídeo al servicio de visión y devuelve la telemetría detectada por fotograma.
      operationId: processMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessMatchRequest'
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/upload:
    post:
      summary: Subir y procesar un archivo de video
      description: Acepta videos MP4, M4V, MOV, AVI, MKV o WebM de hasta 1 GB y retransmite el archivo en streaming al servicio de visión.
      operationId: uploadMatchVideo
      parameters:
        - name: X-Video-Filename
          in: header
          required: true
          schema:
            type: string
          description: Nombre de archivo codificado con URL encoding.
        - name: X-Title
          in: header
          required: false
          schema:
            type: string
          description: Título del partido codificado con URL encoding.
        - name: X-Match-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: Identificador de partido usado para consultar progreso.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Procesamiento completado y telemetría devuelta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessMatchResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/status:
    get:
      summary: Consultar estado del procesamiento
      description: Endpoint planificado, aún no implementado en el backend.
      operationId: getMatchStatus
      x-implementation-status: planned
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estado actual de la tarea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatusResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/progress:
    get:
      summary: Consultar fotogramas procesados
      description: Devuelve el avance actual del procesamiento del video.
      operationId: getMatchProgress
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Progreso actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchProgressResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /matches/{matchId}/telemetry:
    get:
      summary: Obtener telemetría táctica y coordenadas para el Overlay
      description: Devuelve las detecciones por fotograma (jugadores y bola) con bbox y coordenadas métricas de la pista.
      operationId: getMatchTelemetry
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos de telemetría devueltos correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTelemetryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /matches/{matchId}/chat:
    post:
      summary: Consulta conversacional al sistema Multi-Agente
      description: Endpoint planificado, aún no implementado. Envía preguntas en lenguaje natural sobre el partido al pool de agentes (Táctico, Biomecánico, Estratégico).
      operationId: queryAgentChat
      x-implementation-status: planned
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: Respuesta generada por los agentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueryResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

components:
  schemas:
    ProcessMatchRequest:
      type: object
      additionalProperties: false
      required:
        - sourceUrl
      properties:
        sourceUrl:
          type: string
          format: uri
          minLength: 1
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        title:
          type: string
          example: "Final Alcaraz vs Sinner - Set 1"
        matchId:
          type: string
          format: uuid

    ProcessMatchResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [completed]
          example: "completed"
        telemetry:
          $ref: '#/components/schemas/MatchTelemetry'

    MatchStatusResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - status
      properties:
        matchId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
          example: "completed"
        progressPercentage:
          type: integer
          minimum: 0
          maximum: 100
          example: 100

    MatchProgressResponse:
      type: object
      additionalProperties: false
      required:
        - processedFrames
        - totalFrames
      properties:
        processedFrames:
          type: integer
          minimum: 0
        totalFrames:
          type: integer
          minimum: 0
          nullable: true

    MatchTelemetryResponse:
      type: object
      additionalProperties: false
      required:
        - matchId
        - telemetry
      properties:
        matchId:
          type: string
          format: uuid
        telemetry:
          $ref: '#/components/schemas/MatchTelemetry'

    MatchTelemetry:
      type: object
      additionalProperties: false
      description: Telemetría consolidada del partido (contrato v2).
      required: [version, video, court, frames, events]
      properties:
        version:
          type: integer
          example: 2
        video:
          type: object
          additionalProperties: false
          required: [fps, width, height, frame_count]
          properties:
            fps:
              type: number
              nullable: true
            width:
              type: integer
              minimum: 0
            height:
              type: integer
              minimum: 0
            frame_count:
              type: integer
              minimum: 0
        court:
          type: object
          additionalProperties: false
          required: [length_meters, width_meters, calibrated]
          properties:
            length_meters:
              type: number
              example: 23.77
            width_meters:
              type: number
              example: 10.97
            calibrated:
              type: boolean
        frames:
          type: array
          items:
            $ref: '#/components/schemas/FrameTelemetry'
        events:
          type: object
          additionalProperties: false
          required: [bounces, hits]
          properties:
            bounces:
              type: array
              items:
                $ref: '#/components/schemas/BounceEvent'
            hits:
              type: array
              items:
                $ref: '#/components/schemas/HitEvent'

    BounceEvent:
      type: object
      additionalProperties: false
      required: [timestamp_seconds, frame_index, x_meters, y_meters, side, confidence, method]
      properties:
        timestamp_seconds:
          type: number
          description: Instante del bote, con resolución inferior a un fotograma.
        frame_index:
          type: integer
        x_meters:
          type: number
        y_meters:
          type: number
        side:
          type: string
          enum: [far, near]
        confidence:
          type: number
        method:
          type: string
          enum: [fit3d, image2d]
          description: fit3d si la posición procede del ajuste balístico 3D; image2d si solo de la trayectoria en imagen.

    HitEvent:
      type: object
      additionalProperties: false
      required: [timestamp_seconds, frame_index, player, type, speed_kmh, point_index, ball, player_position, confidence]
      properties:
        timestamp_seconds:
          type: number
        frame_index:
          type: integer
        player:
          type: string
          enum: [far, near]
        type:
          type: string
          enum: [serve, volley, forehand, backhand]
        speed_kmh:
          type: number
          nullable: true
          description: Velocidad estimada de salida de la pelota; null si no se pudo medir.
        point_index:
          type: integer
        ball:
          type: object
          additionalProperties: false
          required: [x, y, z]
          properties:
            x:
              type: number
              nullable: true
            y:
              type: number
              nullable: true
            z:
              type: number
              nullable: true
        player_position:
          type: object
          additionalProperties: false
          required: [x, y]
          properties:
            x:
              type: number
            y:
              type: number
        confidence:
          type: number

    FrameTelemetry:
      type: object
      additionalProperties: false
      required:
        - frame_index
        - timestamp_seconds
        - detections
      properties:
        frame_index:
          type: integer
          example: 0
        timestamp_seconds:
          type: number
          example: 0.04
        court_corners:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          description: Vértices en píxeles usados para la calibración, en orden alrededor de la pista; null si no se ha calibrado.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        detections:
          type: array
          items:
            $ref: '#/components/schemas/DetectionTelemetry'

    DetectionTelemetry:
      type: object
      additionalProperties: false
      required:
        - class
        - confidence
        - bbox
        - x_meters
        - y_meters
      properties:
        class:
          type: string
          enum: [player, ball]
        confidence:
          type: number
          example: 0.97
        carried_forward:
          type: boolean
          description: Indica una posición de jugador reutilizada de un fotograma anterior, no una detección nueva.
        interpolated:
          type: boolean
          description: Indica una posición de pelota estimada a partir de su trayectoria en un fotograma donde no se detectó; no es una medición.
        source:
          type: string
          enum: [yolo, yolo_court, color, motion, interpolated, flight3d]
          description: >-
            Origen de la posición de la pelota: un detector (yolo, yolo_court, color, motion) validado por su trayectoria,
            la interpolación en imagen entre mediciones (interpolated) o el vuelo balístico 3D ajustado (flight3d).
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
        x_meters:
          type: number
          nullable: true
          description: Posición en metros a lo largo de la pista; null si la pista no está calibrada.
          example: 1.2
        y_meters:
          type: number
          nullable: true
          description: Posición en metros a lo ancho de la pista; null si la pista no está calibrada.
          example: 4.5
        z_meters:
          type: number
          nullable: true
          description: Altura estimada de la pelota por ajuste balístico; null si no se pudo reconstruir.

    ChatQueryRequest:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          example: "¿Por qué estoy perdiendo puntos cuando juego cruzado desde el fondo?"

    ChatQueryResponse:
      type: object
      additionalProperties: false
      required:
        - answer
        - agentRole
      properties:
        answer:
          type: string
          example: "Has realizado 14 tiros cruzados. En un 65% de los casos la bola cayó corta..."
        agentRole:
          type: string
          example: "Agente Táctico"
        recommendations:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    400BadRequest:
      description: Solicitud incorrecta o parámetros faltantes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    502BadGateway:
      description: El servicio de visión no pudo procesar el vídeo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'