<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NetPoint AI: análisis táctico de tenis a partir de vídeo. Botes, golpes, mapa de pista y un coach que explica el partido." />
    <meta name="theme-color" content="#0a1424" />
    <title>NetPoint AI</title>
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash.
      try { if (localStorage.getItem('netpoint-theme') === 'light') document.documentElement.dataset.theme = 'light' } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
